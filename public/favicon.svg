  <rect width="64" height="64" rx="16" fill="#020617"/>
  
  <!-- Subtle architectural precision frame -->
  <rect x="4" y="4" width="56" height="56" rx="12" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Geometric Solar Cell Array Base Lines (Slate-700) -->
  <line x1="16" y1="20" x2="48" y2="20" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="32" x2="48" y2="32" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="44" x2="48" y2="44" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Vertical Busbars -->
  <line x1="26" y1="16" x2="26" y2="48" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="38" y1="16" x2="38" y2="48" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- The WattPeak Power Vector (Sharp Precision Polygon in Amber-500) -->
