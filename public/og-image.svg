    <text x="96" y="50" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">wattpeak<tspan fill="#f59e0b">.de</tspan></text>
  </g>

